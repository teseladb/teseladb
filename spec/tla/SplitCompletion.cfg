\* Two replicas, one cut key drawn twice, three splits and a log of five entries: split, merge and
\* split again at the same key, with a replica left behind the merge.
CONSTANTS
    Node = {n1, n2}
    Cut = {c1, c2}
    MaxSplits = 3
    MaxLog = 5
    ByEnd = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT TableMatchesLog
CHECK_DEADLOCK FALSE
