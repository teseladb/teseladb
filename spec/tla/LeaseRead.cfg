\* δ = 0.10: the lease of 11 local ticks lasts at most ⌈11 / 0.9⌉ = 13 global ticks, the vote guard
\* of 15 local ticks at least ⌊15 / 1.1⌋ = 13 and the boot guard of 30 local ticks at least
\* ⌊30 / 1.1⌋ = 27. Safety only depends on their order (the lease never outlives either guard),
\* so they are scaled down to 2, 2 and 4 to keep the exploration small.
CONSTANTS
    Node = {n1, n2, n3}
    LeaseMax = 2
    GuardMin = 2
    BootMin = 4
    MaxTerm = 3
    MaxValue = 1
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT LeaseReadsAreFresh
CHECK_DEADLOCK FALSE
