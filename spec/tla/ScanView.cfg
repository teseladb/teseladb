\* Up to 4 entries (writes, a transaction's intent and its resolution) and 2 scans of one range,
\* with the views its core publishes (005 FR-031): 2,067,962 states, 509,544 distinct, depth 22,
\* 2 seconds (19-11-2026). Each of these violates ScansSeeAnswered, with one worker:
\* EntryInView = FALSE after 625 distinct states, LooksAtAnswered = FALSE after 257,
\* CheckNotes = FALSE after 1,620 and ResolutionHeld = FALSE after 4,177.
CONSTANTS
    MaxWrites = 4
    MaxScans = 2
    EntryInView = TRUE
    AnswersAfterViews = FALSE
    LooksAtAnswered = TRUE
    CheckNotes = TRUE
    ResolutionHeld = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ScansSeeAnswered
CHECK_DEADLOCK FALSE
