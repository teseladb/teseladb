\* Safety: two nodes, leases of two ticks, five ticks of time, two changes of users or roles and
\* one crash. The liveness property is checked by AuthzFence.liveness.cfg.
CONSTANTS
    Node = {n1, n2}
    Lease = 2
    MaxTime = 5
    MaxChanges = 2
    MaxCrashes = 1
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT FencedAfterAnswer
INVARIANT FencedWithinLease
CHECK_DEADLOCK FALSE
