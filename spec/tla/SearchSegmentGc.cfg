\* Two keys, six writes and a retention of two ticks. With RebuildBehind = FALSE TLC breaks
\* SegmentsExact at depth 9: the segments catch up at 1, a deletion comes at 2, the GC raises the
\* floor past it and drops it, and the next catch-up reads only the changes above 1 that remain.
CONSTANTS
    Keys = {k1, k2}
    MaxTime = 6
    Retention = 2
    RebuildBehind = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SegmentsExact
CHECK_DEADLOCK FALSE
