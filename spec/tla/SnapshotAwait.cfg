\* One follower, a log of up to four entries and two restarts.
\* CapCommit is the code (multiraft `commit_cap`, seed 4058 of txn-bank). With CapCommit = FALSE TLC
\* breaks CommitSafe at depth 6: a leader's snapshot taken in memory, another Ready's hard state written
\* with its commit index, and a restart before the snapshot is durable read back a commit index past
\* the log.
CONSTANTS
    MaxLog = 4
    MaxRestarts = 2
    CapCommit = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT StateMachineSafe
INVARIANT CommitSafe
INVARIANT NothingHandedWhileWaiting
INVARIANT Ordered
CHECK_DEADLOCK FALSE
