\* Two ranges with one document each, two values and up to 5 marks: every order of the state
\* moves, the leaders' catching up, the writes (deletes too) and the backfill. With
\* `Barrier = FALSE` the same bounds catch a leader that writes after T with a state that keeps no
\* index: TLC reports ReadyIsExact violated.
CONSTANTS
    Range = {r1, r2}
    Val = {1, 2}
    MaxTs = 5
    Barrier = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadyIsExact
INVARIANT ViewsFollow
CHECK_DEADLOCK FALSE
