\* Three nodes, a lease of 2 ticks (250 ms), 1 version and 1 read in 5 ticks (from 4 to 9); a jump keeps
\* its node aside 2 ticks. Here the clocks of a majority go back or forward 4 ticks (500 ms) together
\* instead of one node jumping: back, past the window they are still a tick below their peaks, the case the
\* peak rule is for (005 FR-006). The window only forbids actions, and the rounds of the lease go on while
\* the holder stands aside (Renew), so every behaviour with the 1 s of the code (8 ticks) is also a
\* behaviour with 2, as long as the window is not shorter than the lease: a holder whose clock jumped
\* reads again only with a round sent after the jump, which carried the clock it jumped to. One fall or
\* rise of the clocks (MaxJumps): a second one only repeats the first after the window. VIEW drops what no
\* longer matters (the end of a window or of a lease that has passed).
\* These bounds give 118,7 million distinct states (depth 15) in 10 minutes with 4 workers (RESULTS.md).
\* Each defence has a configuration of the model that breaks ReadsAreStable here (D-069, D-083):
\* - the read cache a lease above the clock heard, without the tick after it (`Acquire` with
\*   `h[1] + LeaseTicks`): the previous holder renewed in a tick, read until the tick its lease ended, at
\*   the highest mark of that tick, and the next holder started at the lowest mark of the same tick
\*   (35 million distinct states, depth 12); in the code, the millisecond after the lease
\*   (`read_cache_minimum`);
\* - the clock raised only at the election, a millisecond above what it heard (the second version of
\*   research R12: `Acquire` with `h[1] + 1` and `Renew` leaving the holder's clock where it was): a
\*   majority moves ahead with the holder, the holder renews while aside and reads at its wall clock
\*   ahead, the majority comes back, and a node that never read so far ahead takes the next lease below
\*   those reads (33 million, depth 12; seed 730 of range-docs);
\* - without both the peak rule (`InMarginAt` without `t + off[n] >= peak[n]`) and the raise (`Acquire`
\*   and `Renew` leaving the clock and the carried clock at what the node heard and its wall clock): the
\*   same failure (42 million, depth 12). Without only the raise, the peak rule does not cover a majority that
\*   moved ahead: the same failure again (42 million, depth 12), since the next holder never read so far
\*   ahead. Without only the peak rule, the raise covers both a fall and a rise (checked with Back = 3: 122
\*   million distinct states, no error).
\* The code keeps every one of them, and each has its own test: the extra millisecond in
\* teseladb-multiraft (`the_cache_starts_above_every_mark_of_the_millisecond_in_which_the_previous_lease_ends`),
\* the clock kept at the wall clock (`a_leader_keeps_its_clock_at_its_wall_clock_for_its_whole_term_and_its_voters_hear_it`),
\* the peak rule in teseladb-hlc (`a_wall_clock_that_went_back_stays_aside_until_it_passes_its_peak`), the
\* raise in teseladb-multiraft (`the_leader_raises_its_clock_to_its_read_cache_and_its_followers_hear_it`)
\* and teseladb-range (`a_new_leader_writes_above_reads_served_while_cluster_time_stood_still`).
CONSTANTS
    N = 3
    MaxTime = 9
    LeaseTicks = 2
    MaxWrites = 1
    MaxReads = 1
    Window = 2
    Back = 4
    SingleJumps = FALSE
    MaxJumps = 1
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT UniqueMarks
INVARIANT ReadsAreStable
CHECK_DEADLOCK FALSE
