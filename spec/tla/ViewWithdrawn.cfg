\* A thread with a view, the core that withdraws it and a successor on the same node with up to
\* two writes (005 FR-028): 120 states, 73 distinct, depth 11 (13-11-2026).
\* Order = "none", the thread that does not look at the withdrawal, violates ReadsAreStable after
\* 26 distinct states (one worker); Order = "check-mark", the one that looks before it takes its
\* mark, after 40.
CONSTANTS
    MaxWrites = 2
    Order = "mark-check"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsAreStable
CHECK_DEADLOCK FALSE
