\* 014 FR-004, FR-019: time up to 3, a log of up to 3 entries, two leases of 2 ticks, and a closed timestamp 1
\* tick behind the time, or at the time while change streams are open; intents commit at their timestamp or
\* pushed above the closed one. With the resolved timestamp at the closed one alone (ignoring the pending
\* intents), a transaction that commits at its intent's timestamp lands under what a change stream emitted, and
\* FollowerReadsStable breaks (depth 7). These bounds give 51,9 million distinct states (depth 32) in 31 minutes
\* with 2 workers on a host shared with other work.
CONSTANTS
    MaxTs = 3
    MaxLog = 3
    LeaseLen = 2
    MaxLeases = 2
    Streams = TRUE
    LagFar = 1
    LagNear = 0
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT FollowerReadsStable
CHECK_DEADLOCK FALSE
