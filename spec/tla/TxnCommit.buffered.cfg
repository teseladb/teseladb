\* Two buffered transactions (008 FR-022) on two keys in one range, timestamps up to 4 and two
\* reads: statements lock their keys in the leader's memory and the commit is one write.
\* With the recovery of a one-phase commit's decision (RecoverOnePhase): 118,314,219 states,
\* 15,616,192 distinct, depth 22, 3 min 13 s (12-11-2026). onephase_ignores_newer violates
\* FirstCommitterWins and onephase_below_reads violates ReadsAreStable (29,295 and 815 distinct
\* states before the recovery was modelled); onephase_ignores_fence violates ReadsAreStable after
\* 1,396.
CONSTANTS
    Txns = {1, 2}
    Keys = {1, 2}
    MaxTs = 4
    MaxReads = 2
    Mutant = "none"
    Pipelined = TRUE
    PushByRead = FALSE
    Buffered = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsAreStable
INVARIANT VersionsAreCommitted
INVARIANT FirstCommitterWins
INVARIANT CommittedWritesKept
CHECK_DEADLOCK FALSE
