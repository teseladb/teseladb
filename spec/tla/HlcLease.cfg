\* Three nodes, a lease of 2 ticks (250 ms), up to 2 writes (one of them may be lost before it commits) and 1 read in
\* 5 ticks (from 4 to 9); one jump of one node, which keeps it aside 4 ticks (500 ms). The window only forbids actions, so
\* every behaviour with the 1 s of the code (8 ticks) is also a behaviour with 4: what holds with 4 holds with 8, and 4
\* ticks are longer than the 3-tick jump. One jump is the fault three voters tolerate; a second one only repeats the
\* first after the node is back. The jump of a majority is in HlcLease.back.cfg.
\* MaxJumps and VIEW keep TLC within a few GB: without the limit on jumps these bounds passed 244 million
\* states and 20 GB without ending, because every tick let any node jump and come back, and those states
\* only repeat one jump.
\* What this configuration checks is a single node's jump: a node that jumps is out of margin until it is
\* back and its window has passed. The fall of a majority, where the peak rule and raising the clock to
\* the read cache at the election matter, is checked in HlcLease.back.cfg, with the mutant that removes
\* both (D-083).
CONSTANTS
    N = 3
    MaxTime = 9
    LeaseTicks = 2
    MaxWrites = 2
    MaxReads = 1
    Window = 4
    Back = 0
    SingleJumps = TRUE
    MaxJumps = 1
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT UniqueMarks
INVARIANT ReadsAreStable
CHECK_DEADLOCK FALSE
