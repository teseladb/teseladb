\* Two replicas, three cores and a log of up to four entries (writes, relocations and their
\* repeats), with the replica that goes on applying after a move until its cut and the export it
\* takes meanwhile (007 FR-011): 2,659,181 states, 593,644 distinct, depth 29 (13-11-2026).
\* WithTail = FALSE, the copy handed without the entries applied since its export, violates
\* NoEntryLost; WarmBeforeMove = TRUE, the export taken before the move is applied, violates
\* CopyNamesItsCore.
CONSTANTS
    Node = {n1, n2}
    Core = {0, 1, 2}
    Start = 1
    MaxLog = 4
    WithTail = TRUE
    WarmBeforeMove = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SingleOwner
INVARIANT CoreMatchesLog
INVARIANT SameIndexSameCore
INVARIANT NoEntryLost
INVARIANT CopyNamesItsCore
CHECK_DEADLOCK FALSE
