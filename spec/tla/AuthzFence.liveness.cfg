\* Liveness: every revocation answers, with the same nodes, leases and changes and no crash (a node
\* that never applies nor acknowledges is still possible: its steps have no fairness).
CONSTANTS
    Node = {n1, n2}
    Lease = 2
    MaxTime = 5
    MaxChanges = 2
    MaxCrashes = 0
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY RevocationsAnswered
CHECK_DEADLOCK FALSE
