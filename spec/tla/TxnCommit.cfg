\* Two transactions on two keys (in two ranges), timestamps up to 4 and two reads, with pipelined
\* intents (008 FR-021): 209,508,137 states, 34,903,906 distinct, depth 27, 2 min (11-11-2026); it
\* was 12,502,328 distinct before the pipelining. commit_without_wait violates CommittedWritesKept
\* after 3,325 distinct states (11-11-2026). With these bounds TLC catches each mutant (Mutant):
\* reader_ignores_intent and commit_below_push violate ReadsAreStable after about 3,500 states,
\* late_coordinator_creates after 111,360 and resolve_before_commit violates VersionsAreCommitted after 1,402;
\* begin_ignores_push (7,766 states) and commit_below_intent (4,557) violate ReadsAreStable (31-10-2026).
CONSTANTS
    Txns = {1, 2}
    Keys = {1, 2}
    MaxTs = 4
    MaxReads = 2
    Mutant = "none"
    Pipelined = TRUE
    PushByRead = FALSE
    Buffered = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsAreStable
INVARIANT VersionsAreCommitted
INVARIANT FirstCommitterWins
INVARIANT CommittedWritesKept
CHECK_DEADLOCK FALSE
