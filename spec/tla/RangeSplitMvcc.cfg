\* A key on each side of the split point, one transaction writing intents on both, two values
\* and timestamps up to 4.
CONSTANTS
    Key = {k1, k2}
    Under = {k2}
    Val = {1, 2}
    Txn = {t1}
    MaxTs = 4
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoVersionLost
INVARIANT NoIntentLost
INVARIANT VersionsInOrder
INVARIANT NoStaleCopyServed
CHECK_DEADLOCK FALSE
