\* TxnCommit with the push by read of 008 T043: a reader pushes a live transaction by reading its record, which raises
\* the read cache of the record's key, and the commit goes above it. 64,061,211 states, 13,222,728 distinct, depth 23,
\* 199 s (08-11-2026). With Mutant = "commit_below_record_reads" TLC finds ReadsAreStable violated after 6,964 states.
CONSTANTS
    Txns = {1, 2}
    Keys = {1, 2}
    MaxTs = 4
    MaxReads = 2
    Mutant = "none"
    Pipelined = TRUE
    PushByRead = TRUE
    Buffered = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsAreStable
INVARIANT VersionsAreCommitted
INVARIANT FirstCommitterWins
INVARIANT CommittedWritesKept
CHECK_DEADLOCK FALSE
