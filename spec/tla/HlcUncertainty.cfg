\* Two nodes skewed up to 1 tick (125 ms) from the median, in either direction (opposite ones
\* included: 250 ms between them), real time up to 4 ticks, two transactions, one lease transfer and
\* up to 4 logical steps per tick: 70,912,878 states, 39,096,622 distinct, depth 19, 10 min with two
\* workers (31-10-2026). With these bounds TLC catches each mutant: zero_uncertainty after 4,808
\* states, median_window after 5,175, observed_bounds_window after 4,365, no_commit_wait after
\* 19,507 and known_commit_ignores_window after 5,114 (ReadsSeeEarlierWrites), push_without_succ
\* after 3,249 (ReadsAreStable) and intent_below_commit after 5,514 (CommitMarksAreUnique).
CONSTANTS
    Nodes = {1, 2}
    Skew = 1
    MaxReal = 4
    MaxWrites = 2
    MaxTransfers = 1
    Scale = 4
    Mutant = "none"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsSeeEarlierWrites
INVARIANT ReadsAreStable
INVARIANT CommitMarksAreUnique
CHECK_DEADLOCK FALSE
