[package]
name = "teseladb-raftlog"
version = "0.4.0"
description = "A Raft log per core: a WAL shared by every Raft group of a core, group snapshots, recovery, salvage, inspection and a CLOCK cache. Sans-I/O."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints.rust]
# The lint set these crates came with (D-169): stricter than the workspace one, with `clippy::pedantic` and
# `clippy::unwrap_used`, and the code carries the `#[expect]` attributes that set asks for.
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(teseladb_bug, values(any()))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
teseladb-types.workspace = true
teseladb-hash.workspace = true
teseladb-crypto.workspace = true
