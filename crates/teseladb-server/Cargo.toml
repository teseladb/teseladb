[package]
name = "teseladb-server"
version = "0.1.13"
description = "The teseladb binary: command line, logging, node start-up with Group 0 on core 0 and the data range over its core's LSM, the inter-node port, joins, snapshot transfers and the development cluster, each of its nodes a process of its own."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "teseladb"
path = "src/main.rs"
# The engine crate is also named `teseladb`; only the library documents under that name.
doc = false

# Its own `main`: the same binary is the test and, in node mode, the cluster's processes.
[[test]]
name = "cluster_local"
harness = false

# Their own `main` (tests/common/procs.rs): every node of a test runs in a process of its own, one
# process per node (D4), and the binary is that process in node mode.
[[test]]
name = "admin"
harness = false

[[test]]
name = "client_port_engine"
harness = false

[[test]]
name = "client_tasks"
harness = false

# A node with its own engine, then ports on the engine the process starts for them: in order, in
# one `main` (D4).
[[test]]
name = "quiesce"
harness = false

[[test]]
name = "xdp_clients"
harness = false

[[test]]
name = "admin_port"
harness = false

[[test]]
name = "api_keys"
harness = false

[[test]]
name = "backup"
harness = false

[[test]]
name = "concurrent_joins"
harness = false

[[test]]
name = "crud"
harness = false

[[test]]
name = "fresh_cluster"
harness = false

[[test]]
name = "oplog_tools"
harness = false

[[test]]
name = "tenant_access"
harness = false

[[test]]
name = "tenant_rate_limits"
harness = false

[[test]]
name = "tenant_storage_quota"
harness = false

[[test]]
name = "tenant_suspend"
harness = false

[[test]]
