[package]
name = "teseladb"
version = "0.1.0"
description = "TeselaDB's engine: a shared-nothing, thread-per-core asynchronous runtime (reactor, futures, per-core memory, disk and network I/O) and the services built on it. Linux only."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Derived from Apache-2.0 and BSD-2-Clause sources: see NOTICE and LICENSE-APACHE.
license = "Apache-2.0 AND BSD-2-Clause"

[lints]
workspace = true

[dependencies]

[features]
default = ["tls", "dns"]
# TLS over gnutls: net/tls.rs, the TLS listeners, connections and credentials of the HTTP
# server and client, and the WebSocket server (its handshake key is a gnutls SHA-1 and
# base64). Without it nothing links gnutls, and the native TCP stack computes the MD5 of its
# initial sequence numbers with net/md5.rs instead of gnutls.
tls = []
# DNS resolution over c-ares: net/dns.rs. Without it nothing links c-ares and build.rs does
# not look for its headers. The c-ares API used is not a feature: build.rs reads the
# installed ares_version.h and sets `cfg(cares_dnsrec)` (c-ares >= 1.28) and
# `cfg(cares_process_fds)` (c-ares >= 1.34).
dns = []
# The DPDK network driver (net/dpdk.rs, net/dpdk_rte.rs) and the DPDK EAL setup of
# core/dpdk_rte.rs; build.rs links libdpdk through pkg-config.
dpdk = []
# CPU and memory topology discovery through hwloc 2.x (>= 2.1, < 3.0) in core/resource.rs,
# core/smp_options.rs and the reactor; without it a simpler built-in topology is used.
hwloc = []
# Per-segment trace output of the TCP state machine (net/tcp.rs).
tcp_debug = []
# Support for gnutls older than 3.5.6 in net/tls.rs: generates DH parameters explicitly.
gnutls_legacy = ["tls"]
# Allocation failure injection (util/alloc_failure_injector.rs): allocation points can be
# made to fail on demand, and critical allocation sections are tracked. For test builds.
alloc_failure_injection = []

# Tests that are programs with their own main(). Each program, bench and example is built from
# a small entry file under `<dir>/entry/` that loads `<dir>/<name>.rs` as a module on Linux and
# is an empty program on other targets, where the engine does not exist.
[[test]]
name = "smp_test"
path = "tests/entry/smp_test.rs"
harness = false

