[package]
name = "teseladb-http"
version = "0.1.0"
description = "HTTP without I/O: an HTTP/1.1 client and the HTTP/1.1, HTTP/2 (HPACK) and Server-Sent Events server side of a port, with CORS, limits and Prometheus metrics."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints.rust]
# The lint set these crates came with (D-169): stricter than the workspace one, with `clippy::pedantic` and
# `clippy::unwrap_used`, and the code carries the `#[expect]` attributes that set asks for.
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(teseladb_bug, values(any()))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
teseladb-crypto.workspace = true
teseladb-tls.workspace = true
teseladb-types.workspace = true
teseladb-x509.workspace = true
