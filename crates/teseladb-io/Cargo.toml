[package]
name = "teseladb-io"
version = "0.1.0"
description = "TeselaDB's real I/O on the engine: the node's shards and their disk executor, the connections between nodes and their protocol, the device log and the AF_XDP port."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
teseladb-stages = { path = "../teseladb-stages" }
teseladb-devlog = { path = "../teseladb-devlog" }
teseladb-types = { workspace = true }
teseladb-raftlog = { workspace = true }
teseladb-hash = { workspace = true }
teseladb-sys = { path = "../teseladb-sys" }
teseladb-raft = { workspace = true }
teseladb-deflate = { workspace = true }
teseladb-keys = { path = "../teseladb-keys" }
teseladb-tls = { workspace = true }
teseladb-x509 = { workspace = true }
# The engine (023): its package and library are `teseladb`; empty outside Linux.
teseladb = { path = "../teseladb-engine", default-features = false }

[dev-dependencies]
teseladb-crypto = { workspace = true }
teseladb-lsm = { path = "../teseladb-lsm" }

# One engine per process (D4): its cases run in order in one `main`.
[[test]]
name = "engine_core_loop"
harness = false

[[test]]
name = "engine_peers"
harness = false

[[test]]
name = "crash_real"
harness = false

[[test]]
name = "crash_real_lsm"
harness = false

[[test]]
name = "device_log"
harness = false

# Engines started and stopped one after the other in one process.
[[test]]
name = "engine_late_lookup"
harness = false

# TLS on the engine against the blocking implementation (023 FR-016): a program with its own main
# that runs inside the engine; empty outside Linux.
[[bench]]
name = "engine_tls"
path = "benches/entry/engine_tls.rs"
harness = false
