[package]
name = "teseladb-wire"
version = "0.1.0"
description = "TeselaDB's RefDb wire protocol: messages, compression, the handshake, command dispatch and errors, without I/O."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
