[workspace]
resolver = "3"
# tools/* joins when teseladb-sim and teseladb-bench are copied (001 T029, T030).
members = ["crates/*", "tools/*"]

[workspace.dependencies]
# The generic crates copied to shared-crates (D-137, constitution 3.0.0, principle V), from the private Cargo registry viuzi
# at the version they were published with (owner, 06-11-2026).
teseladb-types = { version = "0.1.0", registry = "viuzi" }
teseladb-hash = { version = "0.1.0", registry = "viuzi" }
teseladb-json = { version = "0.1.0", registry = "viuzi" }
teseladb-crypto = { version = "0.1.0", registry = "viuzi" }
teseladb-x509 = { version = "0.1.0", registry = "viuzi" }
teseladb-tls = { version = "0.2.0", registry = "viuzi" }
teseladb-bson = { version = "0.1.5", registry = "viuzi" }
teseladb-compress = { version = "0.1.0", registry = "viuzi" }
teseladb-deflate = { version = "0.1.0", registry = "viuzi" }
teseladb-http = { version = "0.1.0", registry = "viuzi" }
teseladb-tz = { version = "0.1.0", registry = "viuzi" }
teseladb-raft = { version = "0.1.1", registry = "viuzi" }
teseladb-raftlog = { version = "0.4.0", registry = "viuzi" }

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "LicenseRef-TeselaDB"

[workspace.lints.rust]
# Logic crates add `#![forbid(unsafe_code)]`; teseladb-sys allows it locally and documents every block with
# `// SAFETY:`.
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(teseladb_bug, values(any()))', 'cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
# Property and simulator tests walk millions of cases: optimize the workspace's crates without losing debug
# assertions.
opt-level = 1

[profile.dev.package.teseladb-crypto]
# teseladb-crypto is optimized in the tests too, as in shared-crates (013 T005): the key derivations of
# SCRAM and the at-rest encryption run on every authenticated or encrypted operation of the tests.
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"

[profile.bench]
inherits = "release"
lto = "fat"
